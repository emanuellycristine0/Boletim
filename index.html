
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>✨ Boletim Digital ✨</h1>
      <p class="subtitle">9º Ano - Ensino Fundamental</p>
      <p class="student-info">Estudante: <span>Estudante Exemplo</span></p>
    </header>

    <!-- Cards de Resumo Superior -->
    <section class="summary-cards">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Atenção</h3>
        <p id="card-atencao" class="card-value">—</p>
      </div>
      <div class="card card-sparkle">
        <h3>Frequência</h3>
        <p id="card-frequencia" class="card-value">92%</p>
        <span class="subtext">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-boletim">
          <!-- As linhas com as disciplinas serão inseridas aqui via JavaScript -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
